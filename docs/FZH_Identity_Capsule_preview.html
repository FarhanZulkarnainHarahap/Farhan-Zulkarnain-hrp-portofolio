<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>FZH / Identity 02 asset review</title>
<style>body{margin:0;background:#10171e;color:#aebfca;font:14px system-ui}canvas{display:block;width:100%;height:100%}main{height:85vh;max-width:950px;margin:auto}header{padding:20px;display:flex;gap:20px;align-items:center;flex-wrap:wrap}button,select{background:#1c2933;border:1px solid #445363;color:inherit;padding:8px}#status{font-size:12px}</style>
<script type="importmap">{"imports":{"three":"/node_modules/three/build/three.module.js","three/addons/":"/node_modules/three/examples/jsm/"}}</script></head>
<body><header><strong>FZH / KINETIC SYSTEM / IDENTITY-02</strong><select id="quality"><option value="">Desktop</option><option value="_LOD">Mobile LOD</option></select><button id="motion">Pause</button><button id="uv">UV check</button><button id="scan">Scan</button><label>Portrait <input id="portrait" type="file" accept="image/*"></label><span id="status">Loading</span></header><main id="viewer"></main>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
const viewer=document.querySelector('#viewer'),status=document.querySelector('#status');
const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));renderer.toneMapping=THREE.AgXToneMapping;
viewer.append(renderer.domElement);
const scene=new THREE.Scene();scene.background=new THREE.Color('#10171e');
const pmrem=new THREE.PMREMGenerator(renderer),room=new RoomEnvironment();
const env=pmrem.fromScene(room);scene.environment=env.texture;room.dispose();pmrem.dispose();
const camera=new THREE.PerspectiveCamera(40,1,.1,100);camera.position.set(0,0,4.7);
const controls=new OrbitControls(camera,renderer.domElement);controls.enableDamping=true;controls.enablePan=false;
scene.add(new THREE.AmbientLight(0xffffff,.6));
const key=new THREE.DirectionalLight(0xffffff,3);key.position.set(3,4,5);scene.add(key);
let model,mixer,paused=matchMedia('(prefers-reduced-motion: reduce)').matches;
const motion=document.querySelector('#motion');motion.textContent=paused?'Play':'Pause';
motion.onclick=()=>{paused=!paused;motion.textContent=paused?'Play':'Pause';};
async function load(suffix=''){
 status.textContent='Loading';
 const gltf=await new GLTFLoader().loadAsync(`/public/models/fzh-identity-capsule/FZH_About_Identity_Capsule${suffix}.glb`);
 if(model){scene.remove(model);mixer.stopAllAction();model.traverse(o=>{if(o.isMesh){o.geometry.dispose();o.material.dispose();}});}
 model=gltf.scene;scene.add(model);mixer=new THREE.AnimationMixer(model);mixer.clipAction(gltf.animations.find(c=>c.name==='idle')).play();
 window.fzh={scene,renderer,model,mixer,clips:gltf.animations,animations:gltf.animations.map(c=>({name:c.name,duration:c.duration}))};
 status.textContent=`${suffix?'Mobile':'Desktop'} · ${gltf.animations.map(c=>`${c.name} ${c.duration}s`).join(' · ')}`;
}
let portraitMap, portraitMaterial;
function setPortrait(map) {
 const plane=model.getObjectByName('Portrait_Plane');
 portraitMap?.dispose();portraitMaterial?.dispose();
 map.flipY=false;map.colorSpace=THREE.SRGBColorSpace;
 const a=map.image.width/map.image.height,t=.8;
 if(a>t){map.repeat.x=t/a;map.offset.x=(1-map.repeat.x)/2;}
 else{map.repeat.y=a/t;map.offset.y=(1-map.repeat.y)/2;}
 map.needsUpdate=true;
 portraitMap=map;portraitMaterial=new THREE.MeshBasicMaterial({map,toneMapped:false});plane.material=portraitMaterial;
}
document.querySelector('#uv').onclick=()=>{
 const canvas=document.createElement('canvas');canvas.width=512;canvas.height=640;
 const ctx=canvas.getContext('2d');
 for(const [x,y,color,label] of [[0,0,'#37abc8','TOP LEFT'],[256,0,'#d9bb78','TOP RIGHT'],[0,320,'#507ba0','BOTTOM LEFT'],[256,320,'#b5c1c8','BOTTOM RIGHT']]){
 ctx.fillStyle=color;ctx.fillRect(x,y,256,320);ctx.fillStyle='#12212a';ctx.font='bold 22px sans-serif';ctx.fillText(label,x+25,y+160);
 }
 setPortrait(new THREE.CanvasTexture(canvas));
 window.fzh.uvCheck=true;
};
document.querySelector('#portrait').onchange=async e=>{
 const file=e.target.files[0];if(!file)return;
 const url=URL.createObjectURL(file);
 try{setPortrait(await new THREE.TextureLoader().loadAsync(url));}finally{URL.revokeObjectURL(url);}
};
document.querySelector('#scan').onclick=()=>{
 const clip=window.fzh.clips.find(c=>c.name==='identity_scan');
 const action=mixer.clipAction(clip);action.reset().setLoop(THREE.LoopOnce,1).play();
};
document.querySelector('#quality').onchange=e=>load(e.target.value);
const resize=()=>{renderer.setSize(viewer.clientWidth,viewer.clientHeight);camera.aspect=viewer.clientWidth/viewer.clientHeight;camera.updateProjectionMatrix();};
new ResizeObserver(resize).observe(viewer);resize();
const clock=new THREE.Clock();renderer.setAnimationLoop(()=>{const dt=Math.min(clock.getDelta(),.1);if(!paused)mixer?.update(dt);controls.update();renderer.render(scene,camera);});
load().catch(e=>{status.textContent=e.message;console.error(e);});
</script></body></html>
